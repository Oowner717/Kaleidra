<script>
/* ==========================================================================
   KALEIDRA
   A generative geometric meditation. One file, no dependencies, offline.

   Sections, in order:
     0  CONFIG            every tunable lives here
     1  PRNG              seeded, reproducible via ?seed=N
     2  NOISE             value noise -> curl (divergence-free) flow
     3  COLOR             OKLCH -> sRGB, CIE L* verification, palette
     4  ARC               the 3-5 minute felt cycle
     5  SYMMETRY          dihedral folding, fold cross-fade
     6  COMPOSITION       void / focus / radial gradients
     7  FIELD             flow grid
     8  NODES             advection, wrap, spatial hash, links
     9  GEOMETRY          harmonic structural layer
    10  RENDER            stamping, bloom, ink accounting
    11  TOUCH             wells, drag, arc nudge
    12  DEBUG             ?debug=1 overlay
    13  LOOP              lifecycle, resize, main loop
   ========================================================================== */
'use strict';

/* ==========================================================================
   0  CONFIG   -- iterate on the piece by editing this block alone
   ========================================================================== */
const CONFIG = {

  /* ---- core canvas + field extent ------------------------------------- */
  core: {
    dprCap:        2,      // device-pixel-ratio ceiling
    fieldCover:    1.22,   // node-field radius / viewport half-diagonal.
                           // >1 so global rotation never reveals empty corners
                           // and the toroidal wrap seam stays off-screen.
    dtClampMs:     50,     // hard ceiling on a single frame's delta time
    edgeFadeFrac:  0.085,  // outer fraction of the field over which alpha -> 0
  },

  /* ---- photosensitive safety: hard limits, applied last --------------- */
  safety: {
    // Max change in ANY global luminance multiplier, per second.
    // 0.30/s == 9% per 300ms, inside the 10%-per-300ms ceiling.
    lumRatePerSec:      0.30,
    bloomRatePerSec:    0.30,
    // The trail-fill alpha also sets exposure (see CONFIG.exposure), so it is
    // limited in absolute terms tightly enough that its RELATIVE rate stays
    // under the ceiling too: 0.006/s against a 0.032 floor is <6% per 300ms.
    bgRatePerSec:       0.006,
    widthRatePerSec:    0.55,   // stroke scale also reads as brightness
    // The cold-start fade-in is this same limiter running from 0 -> 1,
    // so start-up cannot outrun the rate ceiling either.
    touchLumCap:        0.055,  // total screen luminance touch may ever add
    touchLumRatePerSec: 0.11,
    reduced: { rotation: 0.5, breath: 0.5, transition: 2.0, touch: 0.45 },
  },

  /* ---- the arc: sole primary driver of the composition ---------------- */
  arc: {
    cycleMinSec: 180,
    cycleMaxSec: 300,
    // phase weights, in order REST GATHER BLOOM DISSOLVE SETTLE
    weights: [0.15, 0.30, 0.15, 0.25, 0.15],
    names:   ['REST', 'GATHER', 'BLOOM', 'DISSOLVE', 'SETTLE'],
    // Keyframes sit at PHASE CENTRES and are smoothstep-interpolated, so the
    // curve is flat at every control point and has no kink at any phase
    // boundary -- the cycle is felt, the boundaries are unmarkable.
    keys: {
      //           REST   GATHER  BLOOM  DISSOL  SETTLE
      density:   [0.36,  0.94,   0.42,  0.68,   0.40],
      // The quiet phases are sparse, not dim: with few elements on screen
      // each one has to carry more light, or REST reads as empty rather than calm.
      luminance: [0.62,  0.72,   1.22,  0.58,   0.55],
      // BLOOM's width rise is deliberately modest: ink is length x width, and
      // ink must fall here. The peak reads brighter through `luminance` and
      // `bloom`, and larger through `expand` -- not through fatter strokes.
      width:     [1.30,  0.98,   1.15,  0.92,   1.18],
      tempo:     [0.52,  0.86,   0.58,  1.06,   0.60],
      trail:     [0.095, 0.080,  0.060, 0.032,  0.085], // background fill alpha
      bloom:     [0.40,  0.58,   1.15,  0.50,   0.36],
      expand:    [0.96,  0.99,   1.07,  1.15,   0.98],
      // Fewer rings at the peak, not more: what remains is what resolves.
      geometry:  [0.34,  0.84,   0.60,  0.42,   0.34],
      cohesion:  [0.44,  0.92,   0.86,  0.44,   0.46], // lattice tightness
      // BLOOM's ink ceiling is deliberately BELOW GATHER's: the peak is
      // brighter and more resolved, never denser.
      inkBudget: [0.085, 0.185,  0.120, 0.150,  0.095],
      focusR:    [0.72,  0.52,   0.34,  0.80,   0.66], // focal radius, Rc units
      voidMix:   [0.30,  0.70,   0.45,  0.10,   0.35], // 0 open margin .. 1 clean margin
    },
    // clamps applied AFTER micro-variation and touch are summed in
    clamp: {
      density: [0.16, 1.00], luminance: [0.34, 1.30], width: [0.80, 1.70],
      tempo:   [0.35, 1.25], expand:    [0.92, 1.20], geometry: [0.10, 1.05],
      cohesion:[0.24, 1.05], focusR:    [0.18, 0.95], voidMix:  [0.05, 0.92],
    },
  },

  /* ---- micro-variation: bounded, irrational, never in charge ---------- */
  micro: {
    periodsSec: [43, 67, 109, 173],
    amp: { density: 0.15, tempo: 0.15, geometry: 0.15, cohesion: 0.15,
           focusR: 0.15, voidMix: 0.12, expand: 0.06, width: 0.08,
           luminance: 0.07 },
  },

  /* ---- symmetry ------------------------------------------------------- */
  symmetry: {
    minFold: 5, maxFold: 12,
    crossfadeSec: 26,        // fold changes cross-fade this long
    midCycleChance: 0.5,     // chance of a second fold change during DISSOLVE
    midCycleAt: 0.70,        // cycle progress at which it may happen
  },

  /* ---- flow field ----------------------------------------------------- */
  flow: {
    grid: 24,             // cells across the field box
    noiseScale: 2.05,     // noise periods across the field box
    evolveRate: 0.021,    // noise z-drift, per second, at tempo 1
    speedPx: 0.055,       // node speed as a fraction of field radius / second
    inertiaSec: 0.55,     // velocity time constant -- keeps motion laminar
    octaveGain: 0.34,
  },

  /* ---- nodes ---------------------------------------------------------- */
  nodes: {
    // Symmetry multiplies: every source node appears 2N times, so a few
    // hundred source nodes is already a couple of thousand marks on screen.
    // The count is kept deliberately low -- fewer elements, longer and
    // brighter, is the whole restraint rule.
    max: 340,
    base: 230,            // at the reference fold (2N = 10)
    foldComp: 0.60,       // count scales by (10/2N)^foldComp, so higher folds
                          // do not multiply into a uniform mesh
    dotFrac: 0.050,       // role 0: bold points  (the "few bold primaries")
    structFrac: 0.170,    // role 1: secondary lattice
    churnPerFrame: 5,     // node count changes per frame (invisible zone only)
    fadeInSec: 1.30,      // a new node's links arrive through the faint buckets
    recyclePerSec: 2.5,   // invisible re-seeding, fights any slow density drift
  },

  /* ---- links ---------------------------------------------------------- */
  links: {
    // The lattice's density is driven by CONNECTIVITY, not by node count:
    //   mean degree = (a0 + a1*cohesion) * density * inkScale * foldComp
    // Node count stays fixed (it is the CPU cost, and only adaptive quality
    // moves it), so density can respond immediately and smoothly, and ink --
    // which goes as sqrt(nodes) * degree^1.5 * width -- falls hard at BLOOM.
    maxDegree: 5,
    degreeAt0: 0.70, degreeAt1: 3.40,
    spanAt0: 1.05, spanAt1: 0.75,      // link radius, in mean-spacing units
    radiusMinFrac: 0.008,              // of field radius
    radiusMaxFrac: 0.130,
    // Three strength buckets. A link crosses them as it forms and breaks with
    // distance, and a new node's links start in the faintest one, so both
    // motion and density changes arrive without a step. Stateless in distance,
    // one small age field for birth.
    bucketAt: [0.52, 0.80],
    bucketAlpha: [1.0, 0.55, 0.22],
    // Each bucket is a separate stroked path replayed once per symmetry stamp.
    // Past this many stamps the faintest bucket is merged into the middle one:
    // at high fold counts the copies already carry the intricacy, and draw
    // calls are the one cost that scales with N.
    mergeBucketsAtStamps: 20,
    budgetRatePerSec: 110,             // how fast the link budget may move
  },

  /* ---- exposure -------------------------------------------------------
     Every stroke is additive against a background repainted at `trail` alpha
     each frame, so a pixel integrates roughly 1/trail frames of it. Stroke
     alpha is therefore scaled by trail/trailRef: changing trail length changes
     how far things smear, NOT how bright the piece is. Without this the arc's
     trail curve would double as an uncontrolled brightness curve.
     ------------------------------------------------------------------- */
  exposure: { trailRef: 0.065 },

  /* ---- three stroke tiers, strictly ----------------------------------- */
  tiers: {
    // Alphas are per-frame at trailRef. The geometry sits nearly still and so
    // integrates ~15 frames; the lattice moves and integrates ~3. That is why
    // the armature's alpha is far lower than the lattice's for a similar
    // apparent brightness.
    boldWidth: 2.35, boldAlpha: 0.060,   // geometry armature -- a FEW primaries
    midWidth:  1.30, midAlpha:  0.145,   // lattice
    fineWidth: 0.66, fineAlpha: 0.050,   // dusting
    geoMidWidth: 1.02, geoMidAlpha: 0.027,
    geoFineWidth: 0.58, geoFineAlpha: 0.0115,
    dotRadius: 2.6, dotWidth: 1.60, dotAlpha: 0.095,
    anchorAlpha: 0.055,
    minFineScale: 0.0,   // the fine tier may be shed all the way out
    minMidScale: 0.34,   // the lattice is never shed below this
  },

  /* ---- harmonic geometry layer ---------------------------------------- */
  geometry: {
    ringsMin: 3, ringsMax: 6,
    radiusInner: 0.20, radiusOuter: 0.98,  // in Rc units
    eccMax: 0.16,                          // harmonic ring eccentricity
    harmonics: [1, 2, 3],
    arcSteps: 13,          // polyline steps per wedge for harmonic rings
    families: ['radial', 'spiral', 'polygonal', 'woven'],
    crossfadeSec: 13,
    tieCount: 2,
    fineTraceRings: 2,
  },

  /* ---- palette -------------------------------------------------------- */
  palette: {
    minStrokeL: 70,        // CIE L* floor for every stroke colour
    maxBgL: 11,            // CIE L* ceiling for the background
    hueDriftPeriodSec: 660,// slower than the arc, always
    baseChroma: 0.125,
    baseLightness: 0.86,   // OKLCH L
    spreadDeg: [0, 30, -36, 168, 96],
    // The ground keeps its own slow cycle inside the cool half of the wheel:
    // a night sky under any stroke palette, never an olive wash.
    bgHueBase: 264, bgHueSpan: 46, bgHuePeriodSec: 940,
    bgL: [0.168, 0.072],   // OKLCH L, centre -> edge (verified against maxBgL)
    bgChroma: 0.032,

  /* ---- trance mechanics ----------------------------------------------- */

    rotPeriodSec: 312,       // full reverse-and-return

    breathLum: 0.075,
    breathScale: 0.026,
    anchorRFrac: 0.048,      // stable centre anchor, in Rc units

  /* ---- composition: negative space is a feature ----------------------- */
  composition: {

                               // composition reads at the minor dimension while

    focusGain: 1.34,           // luminance multiplier at the focal radius
    focusQuiet: 0.72,          // multiplier away from it -- one focal event
    focusWidth: 0.34,          // focal band width, Rc units
    // Beyond tierIn the lattice hands over to the fine tier, one link at a
    // time, so the readable composition stays at the minor dimension while the

  /* ---- bloom: this is where "flashy" comes from ----------------------- */
  bloom: {
    bufferScale: 0.5,      // bright pass renders at half device resolution

    wideWeight: 0.58,      // the widest halo, kept restrained so strokes keep

  },

  /* ---- ink: restraint, measured ---------------------------------------- */
  ink: {

    scaleMin: 0.22,
    visSamples: 96,        // resolution of the on-screen-visibility table
  },

  /* ---- touch: influence, never control -------------------------------- */
  touch: {
    maxPointers: 5,
    riseMs: 300,
    decayMinSec: 4, decayMaxSec: 8,
    radiusFrac: 0.115,      // of the minor viewport dimension
    swirl: 0.75,            // divergence-free component (dominant)
    radial: 0.22,           // weak attract/repel
    dragGain: 0.55,
    dragMaxPxPerSec: 900,
    detailGain: 1.42,       // local link-radius bloom under the finger
    glowAlpha: 0.024,
    arcNudgeMaxFrac: 0.10,  // at most +-10% of a cycle, per cycle
    arcNudgeRate: 0.26,     // clock runs at most 26% faster while touched
    arcNudgeSmoothSec: 2.4, // rapid tapping cannot chain blooms
  },

  /* ---- performance ----------------------------------------------------- */
  perf: {
    lowFpsMs: 20.0,        // ~50fps: start shedding
    goodFpsMs: 17.2,       // ~58fps: allow recovery
    qualityMin: 0.34,
    qualityShedPerSec: 0.35,
    qualityRecoverPerSec: 0.07,

/* ==========================================================================
   1  PRNG  -- seeded, reproducible
   ========================================================================== */
const QUERY = new URLSearchParams(location.search);
const DEBUG = QUERY.get('debug') === '1';

const SEED = (function () {
  const q = QUERY.get('seed');
  if (q !== null && q !== '' && isFinite(+q)) return (+q) >>> 0;
  return (Date.now() ^ (Math.random() * 0x100000000)) >>> 0;
})();

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(SEED);
const rr = (a, b) => a + (b - a) * rnd();
const ri = (a, b) => Math.floor(a + (b - a + 1) * rnd());
const pick = (arr) => arr[Math.floor(rnd() * arr.length) % arr.length];

console.log('%cKaleidra', 'color:#8ef;font:600 13px ui-monospace,monospace',
            '— seed', SEED, '— reproduce with ?seed=' + SEED);

/* ---- small maths ------------------------------------------------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));
const smootherstep = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * t * (t * (t * 6 - 15) + 10));

/* Rate-limited approach: the single choke point for anything that can move
   large-area luminance. Nothing bypasses this. */
function slew(current, target, maxPerSec, dt) {
  const d = target - current;
  const m = maxPerSec * dt;
  return d > m ? current + m : d < -m ? current - m : target;
}

/* ==========================================================================
   2  NOISE  -- value noise, then curl for a divergence-free (non-clumping) flow
   ========================================================================== */
const PERM = new Uint8Array(512);
(function buildPerm() {
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();

function h3(i, j, k) { return PERM[(PERM[(PERM[i & 255] + j) & 255] + k) & 255] / 255; }

function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c000 = h3(xi, yi, zi), c100 = h3(xi + 1, yi, zi);
  const c010 = h3(xi, yi + 1, zi), c110 = h3(xi + 1, yi + 1, zi);
  const c001 = h3(xi, yi, zi + 1), c101 = h3(xi + 1, yi, zi + 1);
  const c011 = h3(xi, yi + 1, zi + 1), c111 = h3(xi + 1, yi + 1, zi + 1);
  const x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u;
  const x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
  const y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
  return (y0 + (y1 - y0) * w) * 2 - 1;
}

/* Two octaves is enough: the flow must read as laminar, not turbulent. */
function fbm(x, y, z) {
  const g = CONFIG.flow.octaveGain;
  return vnoise(x, y, z) * (1 - g) +
         vnoise(x * 2.07 + 31.7, y * 2.07 - 11.3, z * 1.61 + 5.1) * g;
}

/* ==========================================================================
   3  COLOR  -- OKLCH for perceptual control, CIE L* for the contract
   ========================================================================== */
function srgbEncode(c) {
  return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
}
function srgbDecode(c) {
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}

/* OKLCH -> linear sRGB (Bjorn Ottosson's matrices) */
function oklchToLinear(L, C, hDeg, out) {
  const h = hDeg * Math.PI / 180;
  const a = C * Math.cos(h), b = C * Math.sin(h);
  const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
  const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
  out[0] = +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
  out[1] = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
  out[2] = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
  return out;
}

const _lin = [0, 0, 0];

/* CIE L* of a linear-RGB triple. This is the number the contract is written in. */
function cieL(lr, lg, lb) {
  const Y = 0.2126 * lr + 0.7152 * lg + 0.0722 * lb;
  return Y <= 0.008856 ? 903.2963 * Y : 116 * Math.pow(Y, 1 / 3) - 16;
}

function inGamut(v) { return v[0] >= -0.001 && v[0] <= 1.001 && v[1] >= -0.001 && v[1] <= 1.001 && v[2] >= -0.001 && v[2] <= 1.001; }

/* Resolve an OKLCH request into an in-gamut sRGB colour whose CIE L* is at
   least `minL`. Chroma yields first, then lightness climbs. Verified, not hoped. */
function resolveStroke(L, C, h, minL, out) {
  let ll = L, cc = C;
  for (let i = 0; i < 24; i++) {
    oklchToLinear(ll, cc, h, _lin);
    const ok = inGamut(_lin);
    const lum = cieL(Math.max(0, _lin[0]), Math.max(0, _lin[1]), Math.max(0, _lin[2]));
    if (ok && lum >= minL) break;
    if (!ok) cc *= 0.92; else ll = Math.min(1, ll + 0.018);
  }
  oklchToLinear(ll, cc, h, _lin);
  out[0] = clamp(srgbEncode(clamp(_lin[0], 0, 1)), 0, 1) * 255;
  out[1] = clamp(srgbEncode(clamp(_lin[1], 0, 1)), 0, 1) * 255;
  out[2] = clamp(srgbEncode(clamp(_lin[2], 0, 1)), 0, 1) * 255;
  out[3] = cieL(clamp(_lin[0], 0, 1), clamp(_lin[1], 0, 1), clamp(_lin[2], 0, 1));
  return out;
}

/* Background: pushed DOWN until CIE L* is under the ceiling. */
function resolveBg(L, C, h, maxL, out) {
  let ll = L, cc = C;
  for (let i = 0; i < 24; i++) {
    oklchToLinear(ll, cc, h, _lin);
    const lum = cieL(Math.max(0, _lin[0]), Math.max(0, _lin[1]), Math.max(0, _lin[2]));
    if (inGamut(_lin) && lum <= maxL) break;
    if (!inGamut(_lin)) cc *= 0.9; else ll *= 0.94;
  }
  oklchToLinear(ll, cc, h, _lin);
  out[0] = clamp(srgbEncode(clamp(_lin[0], 0, 1)), 0, 1) * 255;
  out[1] = clamp(srgbEncode(clamp(_lin[1], 0, 1)), 0, 1) * 255;
  out[2] = clamp(srgbEncode(clamp(_lin[2], 0, 1)), 0, 1) * 255;
  out[3] = cieL(clamp(_lin[0], 0, 1), clamp(_lin[1], 0, 1), clamp(_lin[2], 0, 1));
  return out;
}

const PAL_N = CONFIG.palette.spreadDeg.length;
const palette = [];
for (let i = 0; i < PAL_N; i++) palette.push([255, 255, 255, 100]);
const bgIn = [0, 0, 0, 0], bgOut = [0, 0, 0, 0];

let hueCurrent = rr(0, 360);
let hueTarget = hueCurrent;

function updatePalette(t) {
  const P = CONFIG.palette;
  const drift = (t / P.hueDriftPeriodSec) * 360;
  const base = hueCurrent + drift;
  for (let i = 0; i < PAL_N; i++) {
    const wob = Math.sin(t * 0.017 + i * 1.7) * 4.5;
    resolveStroke(P.baseLightness - (i === 0 ? -0.04 : 0.015 * i),
                  P.baseChroma * (i === 0 ? 0.72 : 1 + 0.1 * Math.sin(i * 2.1)),
                  base + P.spreadDeg[i] + wob, P.minStrokeL, palette[i]);
  }
  const bh = P.bgHueBase + P.bgHueSpan * Math.sin(TAU * t / P.bgHuePeriodSec);
  resolveBg(P.bgL[0], P.bgChroma, bh, P.maxBgL, bgIn);
  resolveBg(P.bgL[1], P.bgChroma * 0.8, bh + 16, P.maxBgL, bgOut);
}

function rgba(c, a) {
  return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a < 0 ? 0 : a > 1 ? 1 : a).toFixed(4) + ')';
}

/* ==========================================================================
   4  ARC  -- the sole primary driver of density, luminance, width, fold,
              tempo and trail length. Everything else only modulates it.
   ========================================================================== */
const PH_N = CONFIG.arc.weights.length;
const PH_START = new Float64Array(PH_N);
const PH_CENTER = new Float64Array(PH_N);
(function () {
  let acc = 0;
  for (let i = 0; i < PH_N; i++) {
    PH_START[i] = acc;
    PH_CENTER[i] = acc + CONFIG.arc.weights[i] * 0.5;
    acc += CONFIG.arc.weights[i];
  }
})();

/* Interpolate between PHASE CENTRES with smoothstep. Because every control
   point is a stationary point of the curve, no phase boundary carries a kink
   -- the cycle is felt but never nameable. */
function arcValue(keys, p) {
  let i0, c0, c1;
  if (p < PH_CENTER[0]) { i0 = PH_N - 1; c0 = PH_CENTER[PH_N - 1] - 1; c1 = PH_CENTER[0]; }
  else {
    i0 = PH_N - 1;
    for (let k = PH_N - 1; k >= 0; k--) if (p >= PH_CENTER[k]) { i0 = k; break; }
    c0 = PH_CENTER[i0];
    c1 = (i0 === PH_N - 1) ? PH_CENTER[0] + 1 : PH_CENTER[i0 + 1];
  }
  const i1 = (i0 + 1) % PH_N;
  return keys[i0] + (keys[i1] - keys[i0]) * smoothstep((p - c0) / (c1 - c0));
}

function phaseIndexAt(p) {
  let i = 0;
  for (let k = 0; k < PH_N; k++) if (p >= PH_START[k]) i = k;
  return i;
}

/* ---- micro-variation: summed sines, irrational periods, hard-capped ---- */
const MICRO_PH = {};
for (const k in CONFIG.micro.amp) {
  MICRO_PH[k] = [rr(0, TAU), rr(0, TAU), rr(0, TAU), rr(0, TAU)];
}
function micro(name, t) {
  const ph = MICRO_PH[name], P = CONFIG.micro.periodsSec;
  return (Math.sin(TAU * t / P[0] + ph[0]) + Math.sin(TAU * t / P[1] + ph[1]) +
          Math.sin(TAU * t / P[2] + ph[2]) + Math.sin(TAU * t / P[3] + ph[3])) * 0.25;
}

const arc = { t: 0, len: 0, p: 0, phase: 0, phaseProg: 0, cycle: 0, v: {} };

/* ---- motif: re-rolled every cycle. New material, same emotional shape. -- */
function rollMotif(avoidFamily) {
  const G = CONFIG.geometry;
  const rings = ri(G.ringsMin, G.ringsMax);
  // never the same geometry family twice running: new material every cycle
  let fam = Math.floor(rnd() * G.families.length);
  for (let i = 0; i < 8 && fam === avoidFamily; i++) fam = Math.floor(rnd() * G.families.length);
  const m = {
    family: fam,
    rings: rings, ringR: [], ringE: [], ringH: [],
    skip: ri(0, 5), spiralK: rr(0.22, 0.62) * (rnd() < 0.5 ? 1 : -1),
    spiralSpan: rr(0.9, 2.1), spiralArms: ri(1, 2),
    phase: rr(0, TAU), phaseRate: rr(-0.011, 0.011),
    gapFrac: rr(0.10, 0.20),
    fineR: [], fineE: [], fineH: [],
  };
  for (let i = 0; i < rings; i++) {
    const u = rings === 1 ? 0.5 : i / (rings - 1);
    m.ringR.push(lerp(G.radiusInner, G.radiusOuter, Math.pow(u, 0.86)) * rr(0.95, 1.05));
    m.ringE.push(rr(-1, 1) * G.eccMax);
    m.ringH.push(pick(G.harmonics));
  }
  for (let i = 0; i < CONFIG.geometry.fineTraceRings; i++) {
    m.fineR.push(rr(0.26, 0.94));
    m.fineE.push(rr(-1, 1) * G.eccMax * 1.5);
    m.fineH.push(pick(G.harmonics) + (rnd() < 0.4 ? 1 : 0));
  }
  return m;
}

let motifA = rollMotif();
let motifB = motifA;
let motifBlend = 1;   // 1 = A only

function newCycle(first) {
  arc.len = rr(CONFIG.arc.cycleMinSec, CONFIG.arc.cycleMaxSec);
  arc.cycle++;
  nudgeBudget = CONFIG.touch.arcNudgeMaxFrac;
  nudgeLocked = false;
  midFoldDone = false;
  if (!first) {
    motifB = rollMotif(motifA.family);
    motifBlend = 0;
    hueTarget = hueCurrent + rr(CONFIG.palette.rerollHueDeg[0], CONFIG.palette.rerollHueDeg[1]) * (rnd() < 0.5 ? 1 : -1);
    setFold(pickFold());
  }
}

function pickFold() {
  const S = CONFIG.symmetry;
  let n = sym.nxt;
  for (let i = 0; i < 8 && n === sym.nxt; i++) n = ri(S.minFold, S.maxFold);
  return n;
}

function updateArc(dt, t) {
  arc.t += dt * (1 + nudgeVel);
  if (arc.t >= arc.len) { arc.t -= arc.len; newCycle(false); }
  arc.p = arc.t / arc.len;
  arc.phase = phaseIndexAt(arc.p);
  arc.phaseProg = (arc.p - PH_START[arc.phase]) / CONFIG.arc.weights[arc.phase];

  const K = CONFIG.arc.keys, CL = CONFIG.arc.clamp, AM = CONFIG.micro.amp, v = arc.v;
  for (const name in K) {
    let x = arcValue(K[name], arc.p);
    const a = AM[name];
    if (a) x *= 1 + a * micro(name, t);
    const c = CL[name];
    if (c) x = clamp(x, c[0], c[1]);
    v[name] = x;
  }
  v.inkBudget = Math.min(v.inkBudget, CONFIG.ink.hardCap);

  // motif cross-fade
  if (motifBlend < 1) {
    motifBlend = Math.min(1, motifBlend + dt / (CONFIG.geometry.crossfadeSec * rmTransition));
    if (motifBlend >= 1) motifA = motifB;
  }
  // a second, optional fold change deep in DISSOLVE
  if (!midFoldDone && arc.p >= CONFIG.symmetry.midCycleAt) {
    midFoldDone = true;
    if (rnd() < CONFIG.symmetry.midCycleChance) setFold(pickFold());
  }
  // hue eases toward its target; never faster than the arc
  hueCurrent += (hueTarget - hueCurrent) * (1 - Math.exp(-dt / CONFIG.palette.hueEaseSec));
}

/* ==========================================================================
   5  SYMMETRY  -- N-fold dihedral folding, cross-faded so it never pops
   ========================================================================== */
const sym = { cur: ri(CONFIG.symmetry.minFold, CONFIG.symmetry.maxFold), nxt: 0, x: 1 };
sym.nxt = sym.cur;
let midFoldDone = false;

function setFold(n) {
  if (n === sym.nxt) return;
  if (sym.x < 1) sym.cur = (sym.x > 0.5) ? sym.nxt : sym.cur;
  sym.x = 0;
  sym.nxt = n;
}
function updateSym(dt) {
  if (sym.x < 1) {
    sym.x = Math.min(1, sym.x + dt / (CONFIG.symmetry.crossfadeSec * rmTransition));
    if (sym.x >= 1) sym.cur = sym.nxt;
  }
}
const FOLDSETS = [{ n: 8, w: 1 }, { n: 8, w: 0 }];
let foldCount = 1;
function activeFolds() {
  if (sym.x >= 1 || sym.cur === sym.nxt) {
    FOLDSETS[0].n = sym.nxt; FOLDSETS[0].w = 1; foldCount = 1;
  } else {
    const s = smootherstep(sym.x);
    FOLDSETS[0].n = sym.cur; FOLDSETS[0].w = 1 - s;
    FOLDSETS[1].n = sym.nxt; FOLDSETS[1].w = s;
    foldCount = 2;
  }
}

/* ==========================================================================
   6  COMPOSITION  -- negative space, focal band, edge fade, all folded into
                      one radial gradient per layer (invariant under the
                      symmetry transforms, so it costs nothing to stamp)
   ========================================================================== */
const comp = { innerVoid: 0.2, outerLimit: 0.9, focusR: 0.5 };

function updateComposition() {
  const C = CONFIG.composition, v = arc.v;
  comp.innerVoid = lerp(C.innerVoid[0], C.innerVoid[1], v.voidMix);
  comp.outerLimit = lerp(C.outerLimit[0], C.outerLimit[1], v.voidMix);
  comp.focusR = v.focusR;
}

/* Alpha envelope in field-radius units. One focal event at a time: the band
   at `focusR` is lifted and everything else is quieted, so brightness moves
   around the composition instead of accumulating everywhere. */
function envelope(u) {
  const ivN = comp.innerVoid * RcN;
  const olN = comp.outerLimit;
  const fuN = clamp(comp.focusR * RcN, ivN * 1.35, olN * 0.96);
  const fwN = CONFIG.composition.focusWidth * RcN;
  const C = CONFIG.composition;

  let a;
  if (u <= ivN * 0.45) a = 0;
  else if (u < ivN * 1.55) a = smoothstep((u - ivN * 0.45) / (ivN * 1.10 + 1e-6));
  else a = 1;

  // The composition is sized to Rc; beyond it the field continues but quiets,
  // so it never competes with the motif and never reads as scattered debris.
  a *= 1 - C.radialQuiet * smoothstep((u - RcN * 0.45) / (RcN * 1.25));

  // Outer fade. It always completes before the field edge, so the toroidal
  // wrap seam (which lives at u >= 1) can never be seen.
  const fadeEnd = Math.min(olN * 1.06, 0.965);
  const fadeStart = Math.min(olN * (1 - CONFIG.core.edgeFadeFrac * 2.35), fadeEnd - 0.06);
  if (u > fadeStart) a *= 1 - smoothstep((u - fadeStart) / (fadeEnd - fadeStart));

  const d = Math.abs(u - fuN) / fwN;
  const k = d >= 1 ? 0 : (1 - d * d) * (1 - d * d);
  a *= C.focusQuiet + (C.focusGain - C.focusQuiet) * k;
  return a < 0 ? 0 : a > 1.5 ? 1.5 : a;
}

const GRAD_STOPS = 16;
const _cmix = [0, 0, 0];
function mixCol(a, b, t) {
  _cmix[0] = a[0] + (b[0] - a[0]) * t;
  _cmix[1] = a[1] + (b[1] - a[1]) * t;
  _cmix[2] = a[2] + (b[2] - a[2]) * t;
  return _cmix;
}

/* Shape + colour only. The layer's actual luminance rides on globalAlpha,
   so this object only has to be rebuilt when the composition drifts. */
function buildLayerGradient(ctx, cA, cB, peak) {
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, Rfield);
  const ivN = comp.innerVoid * RcN, olN = comp.outerLimit;
  let last = -1;
  for (let i = 0; i <= GRAD_STOPS; i++) {
    let u = i / GRAD_STOPS;
    if (u <= last) u = last + 1e-4;
    if (u > 1) break;
    last = u;
    const a = Math.min(1, envelope(u) * peak);
    const mix = clamp((u - ivN) / Math.max(0.02, olN - ivN), 0, 1);
    g.addColorStop(u, rgba(mixCol(cA, cB, mix), a));
  }
  return g;
}

/* ==========================================================================
   7  FIELD  -- curl of a scalar noise potential. Divergence-free, so node
                density can never pile into a dead knot.
   ========================================================================== */
const FG = CONFIG.flow.grid;
const PSI = new Float32Array((FG + 3) * (FG + 3));
const CURLX = new Float32Array((FG + 1) * (FG + 1));
const CURLY = new Float32Array((FG + 1) * (FG + 1));
let noiseZ = rr(0, 500);
let flowScale = 1;

function updateFlow(dt, tempo) {
  noiseZ += dt * CONFIG.flow.evolveRate * tempo;
  const inv = CONFIG.flow.noiseScale / B;
  const stride = FG + 3;
  const step = 2 * B / FG;
  for (let j = -1; j <= FG + 1; j++) {
    const wy = (-B + step * j) * inv;
    const row = (j + 1) * stride;
    for (let i = -1; i <= FG + 1; i++) {
      PSI[row + i + 1] = fbm((-B + step * i) * inv, wy, noiseZ);
    }
  }
  let acc = 0;
  const s2 = FG + 1;
  for (let j = 0; j <= FG; j++) {
    for (let i = 0; i <= FG; i++) {
      const c = (j + 1) * stride + (i + 1);
      const gx = PSI[c + 1] - PSI[c - 1];
      const gy = PSI[c + stride] - PSI[c - stride];
      const k = j * s2 + i;
      CURLX[k] = gy; CURLY[k] = -gx;
      acc += gy * gy + gx * gx;
    }
  }
  // Normalise so tuning `speedPx` means something stable regardless of noise.
  const rms = Math.sqrt(acc / ((FG + 1) * (FG + 1))) || 1e-6;
  const want = (CONFIG.flow.speedPx * Rfield) / rms;
  flowScale = flowScale <= 0 ? want : flowScale + (want - flowScale) * Math.min(1, dt * 1.2);
}

let flowX = 0, flowY = 0;
function sampleFlow(x, y) {
  let u = (x + B) / (2 * B) * FG, v = (y + B) / (2 * B) * FG;
  if (u < 0) u = 0; else if (u > FG) u = FG;
  if (v < 0) v = 0; else if (v > FG) v = FG;
  const i = u < FG ? u | 0 : FG - 1, j = v < FG ? v | 0 : FG - 1;
  const fu = u - i, fv = v - j, s2 = FG + 1;
  const k00 = j * s2 + i, k10 = k00 + 1, k01 = k00 + s2, k11 = k01 + 1;
  const a = CURLX[k00] + (CURLX[k10] - CURLX[k00]) * fu;
  const b = CURLX[k01] + (CURLX[k11] - CURLX[k01]) * fu;
  flowX = (a + (b - a) * fv) * flowScale;
  const c = CURLY[k00] + (CURLY[k10] - CURLY[k00]) * fu;
  const d = CURLY[k01] + (CURLY[k11] - CURLY[k01]) * fu;
  flowY = (c + (d - c) * fv) * flowScale;
}

/* ==========================================================================
   8  NODES  -- advected through the flow, folded into the fundamental wedge,
                linked into a lattice by a spatial hash.

   Nodes live in a toroidal square field box and are FOLDED into the wedge at
   draw time. Folding is area-preserving and continuous across the mirror
   lines, so the assembled rosette has uniform density and no seam anywhere:
   there is no wedge edge to clip against, and nothing bounces.
   ========================================================================== */
const MAXN = CONFIG.nodes.max;
const nx = new Float32Array(MAXN), ny = new Float32Array(MAXN);
const nvx = new Float32Array(MAXN), nvy = new Float32Array(MAXN);
const fxA = new Float32Array(MAXN), fyA = new Float32Array(MAXN);
const nrad = new Float32Array(MAXN);
const nboost = new Float32Array(MAXN);
const nAct = new Uint8Array(MAXN);
const nAge = new Float32Array(MAXN);   // seconds since activation, for birth fade
const nIn = new Uint8Array(MAXN);
const nRole = new Uint8Array(MAXN);
const nPri = new Float32Array(MAXN);   // stable per-node rank: lets the degree
                                       // cap take a fractional value and still
                                       // change one node at a time

const ROLE_N0 = Math.max(6, Math.round(MAXN * CONFIG.nodes.dotFrac));
const ROLE_N1 = Math.max(24, Math.round(MAXN * CONFIG.nodes.structFrac));
const ROLE_START = [0, ROLE_N0, ROLE_N0 + ROLE_N1];
const ROLE_END = [ROLE_N0, ROLE_N0 + ROLE_N1, MAXN];
for (let r = 0; r < 3; r++) for (let i = ROLE_START[r]; i < ROLE_END[r]; i++) nRole[i] = r;
for (let i = 0; i < MAXN; i++) nPri[i] = rnd();

const roleActive = [0, 0, 0];
const roleCursor = [0, 0, 0];
const roleTarget = [0, 0, 0];
let nActive = 0;

function setNodeActive(i, on) {
  const want = on ? 1 : 0;
  if (nAct[i] === want) return;
  nAct[i] = want;
  if (on) nAge[i] = 0;
  roleActive[nRole[i]] += on ? 1 : -1;
  nActive += on ? 1 : -1;
}

/* Density changes are applied only where nobody can see them: nodes appear
   and disappear strictly outside the visible disc. */
function placeInvisible(i) {
  for (let k = 0; k < 14; k++) {
    const x = rr(-B, B), y = rr(-B, B);
    if (visFrac(Math.sqrt(x * x + y * y) * SC) <= 0) {
      nx[i] = x; ny[i] = y; nvx[i] = 0; nvy[i] = 0;
      nrad[i] = Math.sqrt(x * x + y * y);
      return true;
    }
  }
  return false;
}

function initNodes() {
  for (let i = 0; i < MAXN; i++) {
    const x = rr(-B, B), y = rr(-B, B);
    nx[i] = x; ny[i] = y; nvx[i] = 0; nvy[i] = 0;
    nrad[i] = Math.sqrt(x * x + y * y);
    nAct[i] = 0; nboost[i] = 1;
  }
  roleActive[0] = roleActive[1] = roleActive[2] = 0;
  nActive = 0;
  computeRoleTargets();
  for (let r = 0; r < 3; r++) {
    const s = ROLE_START[r];
    for (let k = 0; k < roleTarget[r]; k++) setNodeActive(s + k, true);
  }
}

function computeRoleTargets() {
  const N = CONFIG.nodes;
  const n2 = 2 * (sym.x > 0.5 ? sym.nxt : sym.cur);
  const total = clamp(Math.round(N.base * quality * Math.pow(10 / n2, N.foldComp)), 40, MAXN);
  roleTarget[0] = clamp(Math.round(total * N.dotFrac), 3, ROLE_END[0] - ROLE_START[0]);
  roleTarget[1] = clamp(Math.round(total * N.structFrac), 10, ROLE_END[1] - ROLE_START[1]);
  roleTarget[2] = clamp(total - roleTarget[0] - roleTarget[1], 0, ROLE_END[2] - ROLE_START[2]);
}

function churnNodes() {
  computeRoleTargets();
  for (let r = 0; r < 3; r++) {
    const s = ROLE_START[r], span = ROLE_END[r] - s;
    let budget = CONFIG.nodes.churnPerFrame;
    let diff = roleTarget[r] - roleActive[r];
    let scanned = 0;
    while (budget > 0 && diff !== 0 && scanned < span) {
      const i = s + roleCursor[r];
      roleCursor[r] = (roleCursor[r] + 1) % span;
      scanned++;
      if (diff > 0) {
        if (!nAct[i] && placeInvisible(i)) { setNodeActive(i, true); diff--; budget--; }
      } else if (nAct[i] && visFrac(nrad[i] * SC) <= 0) {
        setNodeActive(i, false); diff++; budget--;
      }
    }
  }
}

/* A trickle of invisible re-seeding. Bilinear sampling of the curl field is
   only approximately divergence-free; this keeps any slow drift from ever
   accumulating, and costs nothing because it only touches unseen nodes. */
let recycleAcc = 0;
function recycleNodes(dt) {
  recycleAcc += dt * CONFIG.nodes.recyclePerSec;
  while (recycleAcc >= 1) {
    recycleAcc -= 1;
    const i = Math.floor(rnd() * MAXN);
    if (nAct[i] && visFrac(nrad[i] * SC) <= 0) placeInvisible(i);
  }
}

function updateNodes(dt) {
  const inertia = 1 - Math.exp(-dt / CONFIG.flow.inertiaSec);
  const tempo = arc.v.tempo;
  const twoB = 2 * B;
  const wellsOn = wellCount > 0;
  const fn = (sym.x < 1 && sym.x > 0.5) ? sym.nxt : sym.cur;
  const seg = TAU / fn, half = seg * 0.5;

  for (let i = 0; i < MAXN; i++) {
    if (!nAct[i]) continue;
    let x = nx[i], y = ny[i];
    sampleFlow(x, y);
    let vx = nvx[i] + (flowX * tempo - nvx[i]) * inertia;
    let vy = nvy[i] + (flowY * tempo - nvy[i]) * inertia;
    nboost[i] = 1;

    if (wellsOn) {
      // Fold this node, gather well forces in folded space, rotate the result
      // back. A touch therefore bends the pattern at every symmetric image of
      // the finger -- local, bounded, and true to the kaleidoscope.
      const r = Math.sqrt(x * x + y * y);
      let th = Math.atan2(y, x); if (th < 0) th += TAU;
      let k = Math.floor(th / seg), t = th - k * seg, m = 1;
      if (t > half) { t = seg - t; m = -1; k = k + 1; }
      const px = r * Math.cos(t), py = r * Math.sin(t);
      let ffx = 0, ffy = 0;
      for (let wi = 0; wi < WELLS.length; wi++) {
        const wl = WELLS[wi];
        if (wl.s <= 0.001) continue;
        const dx = px - wl.fx, dy = py - wl.fy;
        const d2 = dx * dx + dy * dy;
        if (d2 >= wl.r2) continue;
        const d = Math.sqrt(d2) + 1e-5;
        const q = 1 - d2 / wl.r2;
        const fall = q * q * wl.s;
        const ux = dx / d, uy = dy / d;
        const T = CONFIG.touch;
        ffx += (-uy * wl.spin * T.swirl + ux * wl.pull * T.radial) * fall * wl.force;
        ffy += (ux * wl.spin * T.swirl + uy * wl.pull * T.radial) * fall * wl.force;
        ffx += wl.vx * fall * T.dragGain;
        ffy += wl.vy * fall * T.dragGain;
        if (fall > 0.04) nboost[i] = Math.max(nboost[i], 1 + (T.detailGain - 1) * fall);
      }
      if (ffx !== 0 || ffy !== 0) {
        const ang = (k % fn) * seg, ca = Math.cos(ang), sa = Math.sin(ang);
        const mx = ffx, my = m * ffy;
        vx += (ca * mx - sa * my) * dt;
        vy += (sa * mx + ca * my) * dt;
      }
    }

    if (nAge[i] < 9) nAge[i] += dt;
    x += vx * dt; y += vy * dt;
    // toroidal wrap -- elements pass through, they never bounce
    x -= twoB * Math.floor((x + B) / twoB);
    y -= twoB * Math.floor((y + B) / twoB);
    nx[i] = x; ny[i] = y; nvx[i] = vx; nvy[i] = vy;
    nrad[i] = Math.sqrt(x * x + y * y);
  }
}

/* ---- fold into the fundamental wedge ---------------------------------- */
let nLinkable = 0;
function foldNodes(n) {
  const seg = TAU / n, half = seg * 0.5;
  nLinkable = 0;
  for (let i = 0; i < MAXN; i++) {
    if (!nAct[i]) { nIn[i] = 0; continue; }
    const r = nrad[i];
    if (r > hashRMax || visFrac(r * SC) <= 0) { nIn[i] = 0; continue; }
    nIn[i] = 1; nLinkable++;
    let th = Math.atan2(ny[i], nx[i]); if (th < 0) th += TAU;
    const k = Math.floor(th / seg);
    let t = th - k * seg;
    if (t > half) t = seg - t;
    fxA[i] = r * Math.cos(t);
    fyA[i] = r * Math.sin(t);
  }
}

/* ---- spatial hash ------------------------------------------------------ */
const GRID_MAX = 104;
const HEAD = new Int32Array(GRID_MAX * GRID_MAX);
const NEXT = new Int32Array(MAXN);
let cellSize = 1, gridW = 1, gridH = 1;

function buildHash(linkR, n) {
  const maxR = linkR * CONFIG.touch.detailGain;
  cellSize = Math.max(maxR, hashRMax / (GRID_MAX - 3));
  gridW = Math.min(GRID_MAX, Math.floor(hashRMax / cellSize) + 2);
  gridH = Math.min(GRID_MAX, Math.floor(hashRMax * Math.sin(Math.PI / n) / cellSize) + 2);
  HEAD.fill(-1, 0, gridW * gridH);
  for (let i = 0; i < MAXN; i++) {
    if (!nIn[i]) continue;
    let cx = fxA[i] / cellSize | 0; if (cx < 0) cx = 0; else if (cx >= gridW) cx = gridW - 1;
    let cy = fyA[i] / cellSize | 0; if (cy < 0) cy = 0; else if (cy >= gridH) cy = gridH - 1;
    const c = cy * gridW + cx;
    NEXT[i] = HEAD[c]; HEAD[c] = i;
  }
}

/* ---- links ------------------------------------------------------------- */
const MAXL = MAXN * 3 + 32;
const lkA = new Int32Array(MAXL), lkB = new Int32Array(MAXL);
const lkT = new Uint8Array(MAXL);      // 0 = lattice mid, 1 = lattice fine
const lkK = new Uint8Array(MAXL);      // strength bucket, 0 (full) .. 2 (faintest)
const deg = new Uint8Array(MAXN);
const lkBins = new Int32Array(6);      // [tier*3 + bucket] -- lets empty passes be skipped
let linkCount = 0;
let linkBudget = 400;

function buildLinks(linkR, stamps, md) {
  const capBase = Math.floor(md), capFrac = md - capBase;
  const bk = CONFIG.links.bucketAt;
  const fadeIn = CONFIG.nodes.fadeInSec;
  const tierIn = CONFIG.composition.tierIn * Rc, tierOut = CONFIG.composition.tierOut * Rc;
  deg.fill(0);
  lkBins.fill(0);
  linkCount = 0;
  const mergeFaint = stamps >= CONFIG.links.mergeBucketsAtStamps;
  const budget = Math.min(MAXL, Math.round(linkBudget));
  for (let i = 0; i < MAXN && linkCount < budget; i++) {
    const capI = capBase + (nPri[i] < capFrac ? 1 : 0);
    if (!nIn[i] || capI <= 0 || deg[i] >= capI) continue;
    const xi = fxA[i], yi = fyA[i], ri_ = nrad[i], bi = nboost[i];
    let cx = xi / cellSize | 0; if (cx < 0) cx = 0; else if (cx >= gridW) cx = gridW - 1;
    let cy = yi / cellSize | 0; if (cy < 0) cy = 0; else if (cy >= gridH) cy = gridH - 1;
    const x0 = cx > 0 ? cx - 1 : 0, x1 = cx < gridW - 1 ? cx + 1 : gridW - 1;
    const y0 = cy > 0 ? cy - 1 : 0, y1 = cy < gridH - 1 ? cy + 1 : gridH - 1;
    for (let gy = y0; gy <= y1; gy++) {
      const row = gy * gridW;
      for (let gx = x0; gx <= x1; gx++) {
        let j = HEAD[row + gx];
        while (j >= 0) {
          const capJ = capBase + (nPri[j] < capFrac ? 1 : 0);
          if (j > i && deg[j] < capJ && deg[i] < capI) {
            const R = linkR * (bi > nboost[j] ? bi : nboost[j]);
            const dx = fxA[j] - xi, dy = fyA[j] - yi;
            const d2 = dx * dx + dy * dy;
            if (d2 < R * R) {
              const mr = (ri_ + nrad[j]) * 0.5;
              if (visFrac(mr * SC) > 0) {
                const d = Math.sqrt(d2);
                lkA[linkCount] = i; lkB[linkCount] = j;
                // Secondary if EITHER end is structural (~1/3 secondary,
                // ~2/3 tertiary dusting -- a graded lattice, not a uniform
                // mesh), then demoted to tertiary out past the composition.
                // The demotion threshold is a stable hash of the pair, so as
                // the band moves links hand over one at a time, never in a step.
                let tier = (nRole[i] <= 1 || nRole[j] <= 1) ? 0 : 1;
                if (tier === 0 && mr * SC > tierIn) {
                  const q = (mr * SC - tierIn) / (tierOut - tierIn);
                  if ((nPri[i] * 7.919 + nPri[j] * 3.271) % 1 < q) tier = 1;
                }
                lkT[linkCount] = tier;
                let bucket = d < R * bk[0] ? 0 : d < R * bk[1] ? 1 : 2;
                const age = nAge[i] < nAge[j] ? nAge[i] : nAge[j];
                if (age < fadeIn) {
                  const ab = age < fadeIn * 0.5 ? 2 : 1;
                  if (ab > bucket) bucket = ab;
                }
                if (mergeFaint && bucket === 2) bucket = 1;
                lkK[linkCount] = bucket;
                lkBins[tier * 3 + bucket]++;
                linkCount++;
                deg[i]++; deg[j]++;
                if (linkCount >= budget) break;
              }
            }
          }
          j = NEXT[j];
        }
        if (linkCount >= budget) break;
      }
      if (linkCount >= budget) break;
    }
  }
}

/* ==========================================================================
   9  GEOMETRY  -- the slow structural layer. Thin harmonic rings, chords,
                   star polygons, spiral arms and epitrochoid tracery, all
                   authored inside one wedge so that stamping reconstructs the
                   whole figure exactly once. This tier supplies the few bold
                   primaries; the lattice never does.

   Every ring is r(t) = A(1 + e cos(h N t)) over t in [0, PI/N]. Its derivative
   vanishes at both wedge edges, so the reassembled curve is smooth across the
   mirror lines -- petals, not corners, and no visible spokes.
   ========================================================================== */
function makeGeo() { return { bold: new Path2D(), mid: new Path2D(), fine: new Path2D(), hasFine: 0 }; }
const geoA = makeGeo(), geoB = makeGeo();

let _gx = 0, _gy = 0, _glen = 0;
function ringPolyline(path, A, e, h, n, phi, steps, t0f, t1f) {
  const a0 = phi * t0f, a1 = phi * t1f;
  let px = 0, py = 0;
  _glen = 0;
  for (let s = 0; s <= steps; s++) {
    const t = a0 + (a1 - a0) * (s / steps);
    const r = A * (1 + e * Math.cos(h * n * t));
    const x = r * Math.cos(t), y = r * Math.sin(t);
    if (s === 0) path.moveTo(x, y);
    else { path.lineTo(x, y); _glen += Math.hypot(x - px, y - py); }
    px = x; py = y;
  }
  return _glen;
}

function chord(path, r0, a0, r1, a1) {
  const x0 = r0 * Math.cos(a0), y0 = r0 * Math.sin(a0);
  const x1 = r1 * Math.cos(a1), y1 = r1 * Math.sin(a1);
  path.moveTo(x0, y0); path.lineTo(x1, y1);
  _gx = (x0 + x1) * 0.5; _gy = (y0 + y1) * 0.5;
  return Math.hypot(x1 - x0, y1 - y0);
}

function spiralArm(path, r0, k, a0, span, steps) {
  let px = 0, py = 0, len = 0, rs = 0, n = 0;
  for (let s = 0; s <= steps; s++) {
    const u = s / steps, t = a0 + span * u;
    const r = r0 * Math.exp(k * span * u);
    const x = r * Math.cos(t), y = r * Math.sin(t);
    if (s === 0) path.moveTo(x, y);
    else { path.lineTo(x, y); len += Math.hypot(x - px, y - py); }
    px = x; py = y; rs += r; n++;
  }
  _gx = rs / n;
  return len;
}

/* Builds one motif into bold / mid / fine, and books the ink it will cost. */
function buildGeometry(m, gp, n, stamps, t, weight) {
  gp.hasFine = 0;
  const G = CONFIG.geometry;
  const phi = Math.PI / n, seg = phi * 2;
  const amt = clamp(arc.v.geometry, 0, 1.05);
  const T = CONFIG.tiers;
  const wScale = widthScale;
  const rings = clamp(Math.round(1 + (m.rings - 1) * amt), 1, m.rings);
  const steps = G.arcSteps;
  const family = G.families[m.family];
  const breathe = 1 + 0.035 * Math.sin(t * 0.041 + m.phase);
  const wBold = T.boldWidth * wScale, wMid = T.geoMidWidth * wScale, wFine = T.geoFineWidth * wScale;

  // ---- radii for this motif, in field units.
  // When the arc thins the geometry out, the surviving rings are spread across
  // the whole radius and always include the outermost one -- REST stays WIDE
  // and sparse instead of collapsing inward.
  const A = [], E = [], HH = [];
  for (let i = 0; i < rings; i++) {
    const src = rings === 1 ? m.rings - 1 : Math.round(i * (m.rings - 1) / (rings - 1));
    A.push(m.ringR[src] * Rc * breathe * (1 + 0.02 * Math.sin(t * 0.029 + src * 2.3)));
    E.push(m.ringE[src]); HH.push(m.ringH[src]);
  }

  const boldIdx = rings > 1 ? (rings - 1) : 0;   // the outermost surviving ring
  const skip = clamp(1 + (m.skip % Math.max(1, Math.floor(n / 2))), 1, Math.min(4, Math.max(1, Math.floor(n / 2) - 1)));

  if (family === 'radial') {
    let L = ringPolyline(gp.bold, A[boldIdx], E[boldIdx], HH[boldIdx], n, phi, steps, 0, 1);
    addInk(L, A[boldIdx], wBold, stamps, weight);
    for (let i = 0; i < rings; i++) {
      if (i === boldIdx) continue;
      L = ringPolyline(gp.mid, A[i], E[i], HH[i], n, phi, steps, 0, 1);
      addInk(L, A[i], wMid, stamps, weight);
    }
    if (amt > 0.45) {
      for (let i = 0; i + 1 < rings; i++) {
        for (let k = 0; k < G.tieCount; k++) {
          const a = phi * (0.32 + 0.36 * k);
          const L2 = chord(gp.fine, A[i], a, A[i + 1], a);
          gp.hasFine = 1;
          addInk(L2, (A[i] + A[i + 1]) * 0.5, wFine, stamps, weight);
        }
      }
    }
  } else if (family === 'polygonal') {
    const a0 = phi * 0.5;
    let L = chord(gp.bold, A[boldIdx], a0, A[boldIdx], a0 + skip * seg);
    addInk(L, Math.hypot(_gx, _gy), wBold, stamps, weight);
    for (let i = 0; i < rings; i++) {
      if (i === boldIdx) continue;
      if (i % 2 === 0) {
        L = chord(gp.mid, A[i], a0, A[i], a0 + Math.max(1, skip - 1) * seg);
        addInk(L, Math.hypot(_gx, _gy), wMid, stamps, weight);
      } else {
        L = ringPolyline(gp.mid, A[i], E[i], HH[i], n, phi, steps, 0, 1);
        addInk(L, A[i], wMid, stamps, weight);
      }
    }
    if (amt > 0.4) {
      for (let i = 0; i + 1 < rings; i++) {
        const L2 = chord(gp.fine, A[i], phi * 0.28, A[i + 1], phi * 0.72);
        gp.hasFine = 1;
        addInk(L2, (A[i] + A[i + 1]) * 0.5, wFine, stamps, weight);
      }
    }
  } else if (family === 'spiral') {
    const span = m.spiralSpan * seg;
    let L = spiralArm(gp.bold, A[0] * 0.9, m.spiralK, phi * 0.5, span, steps + 6);
    addInk(L, _gx, wBold, stamps, weight);
    for (let k = 0; k < m.spiralArms && amt > 0.3; k++) {
      L = spiralArm(gp.mid, A[Math.min(rings - 1, k + 1)] * 0.55, -m.spiralK * 0.72,
                    phi * (0.25 + 0.5 * k), span * 0.8, steps + 4);
      addInk(L, _gx, wMid, stamps, weight);
    }
    for (let i = 0; i < rings; i += 2) {
      const L2 = ringPolyline(gp.mid, A[i], E[i], HH[i], n, phi, steps, 0, 1);
      addInk(L2, A[i], wMid, stamps, weight);
    }
  } else { // woven
    const g = m.gapFrac;
    let L = ringPolyline(gp.bold, A[boldIdx], E[boldIdx], HH[boldIdx], n, phi, steps, 0, 0.5 - g);
    addInk(L, A[boldIdx], wBold, stamps, weight);
    L = ringPolyline(gp.bold, A[boldIdx], E[boldIdx], HH[boldIdx], n, phi, steps, 0.5 + g, 1);
    addInk(L, A[boldIdx], wBold, stamps, weight);
    for (let i = 0; i < rings; i++) {
      if (i === boldIdx) continue;
      const off = (i % 2) * 0.5;
      L = ringPolyline(gp.mid, A[i], E[i], HH[i], n, phi, steps, off * 0.5, 1 - off * 0.5);
      addInk(L, A[i], wMid, stamps, weight);
    }
    if (amt > 0.4) {
      for (let i = 0; i + 1 < rings; i++) {
        const L2 = chord(gp.fine, A[i] * 0.98, phi * 0.5, A[i + 1] * 1.02, phi * 0.5 + seg * 0.5);
        gp.hasFine = 1;
        addInk(L2, Math.hypot(_gx, _gy), wFine, stamps, weight);
      }
    }
  }

  // ---- fine epitrochoid-style tracery, common to every family
  if (amt > 0.3) {
    const k = fineScale;
    if (k > 0.02) {
      for (let i = 0; i < m.fineR.length; i++) {
        const Ar = m.fineR[i] * Rc * breathe;
        const L = ringPolyline(gp.fine, Ar, m.fineE[i] * (0.6 + 0.4 * amt), m.fineH[i], n, phi, steps + 5, 0, 1);
        gp.hasFine = 1;
        addInk(L, Ar, wFine, stamps, weight);
      }
    }
  }
}

/* ==========================================================================
   10  RENDER  -- canvas, visibility table, ink accounting, symmetry stamping,
                  bloom. Composited with 'lighter'; the background is painted
                  at low alpha every frame so trails decay (never clearRect).
   ========================================================================== */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha: false, desynchronized: true });

const bA = document.createElement('canvas'), bActx = bA.getContext('2d');
const bB = document.createElement('canvas'), bBctx = bB.getContext('2d');
const bC = document.createElement('canvas'), bCctx = bC.getContext('2d');
const carry = document.createElement('canvas'), carryCtx = carry.getContext('2d');

let W = 0, H = 0, DPR = 1;
let Rdiag = 1, Rfield = 1, Rc = 1, RcN = 1, B = 1, hashRMax = 1;
let cxCss = 0, cyCss = 0;

/* ---- how much of a stamped ring at radius r actually lands on screen ---- */
const VIS_N = CONFIG.ink.visSamples;
const visTab = new Float32Array(VIS_N + 1);
let visMaxR = 1;

function buildVisTable() {
  visMaxR = Rfield * 1.35;
  const M = 128, ax = W * 0.5, ay = H * 0.5;
  for (let i = 0; i <= VIS_N; i++) {
    const r = visMaxR * i / VIS_N;
    if (r === 0) { visTab[i] = 1; continue; }
    let hit = 0;
    for (let j = 0; j < M; j++) {
      const a = TAU * (j + 0.5) / M;
      if (Math.abs(r * Math.cos(a)) <= ax && Math.abs(r * Math.sin(a)) <= ay) hit++;
    }
    visTab[i] = hit / M;
  }
}
function visFrac(r) {
  const u = r / visMaxR * VIS_N;
  if (u <= 0) return 1;
  if (u >= VIS_N) return 0;
  const i = u | 0, f = u - i;
  return visTab[i] + (visTab[i + 1] - visTab[i]) * f;
}

/* ---- ink: sum(strokeLength * lineWidth) / viewport area ----------------- */
let inkAccum = 0, inkNow = 0, inkScale = 1;
function addInk(lenField, rMidField, widthCss, stamps, weight) {
  if (weight !== undefined && weight <= 0.002) return;   // not drawn, not counted
  inkAccum += lenField * SC * widthCss * stamps * visFrac(rMidField * SC);
}

/* ---- live state ------------------------------------------------------- */
let SC = 1;                 // content scale: arc expand * breathing
let widthScale = 1;         // stroke width scale (slew-limited)
let lumGlobal = 0;          // global luminance multiplier (slew-limited; also the cold-start fade)
let bloomAlpha = 0;         // slew-limited
let bgAlpha = 0.04;         // slew-limited
let densityTotal = 0.3;
let expo = 1;             // exposure compensation for the current trail length
let midScale = 1, fineScale = 1;
let quality = 1;
let frameAvgMs = 16.7;
let rotAngle = rr(0, TAU);
let rotSpeed = 0;
let geoPhase = 0;
let rmReduced = false, rmRotation = 1, rmBreath = 1, rmTransition = 1, rmTouch = 1;
let gradEpoch = -1, gradFrame = 0;

function resetCtx(c) {
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.imageSmoothingEnabled = true;
  c.globalAlpha = 1;
  c.globalCompositeOperation = 'source-over';
}

function resize() {
  const w = Math.max(1, Math.round(window.innerWidth || document.documentElement.clientWidth || 320));
  const h = Math.max(1, Math.round(window.innerHeight || document.documentElement.clientHeight || 480));
  const dpr = Math.min(CONFIG.core.dprCap, Math.max(1, window.devicePixelRatio || 1));
  const pw = Math.max(1, Math.round(w * dpr)), ph = Math.max(1, Math.round(h * dpr));
  if (pw === cv.width && ph === cv.height && w === W && h === H) return;

  const had = cv.width > 1 && cv.height > 1 && W > 0;
  if (had) {
    carry.width = cv.width; carry.height = cv.height;
    carryCtx.globalCompositeOperation = 'copy';
    carryCtx.drawImage(cv, 0, 0);
  }

  W = w; H = h; DPR = dpr;
  cv.width = pw; cv.height = ph;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';

  const bs = CONFIG.bloom.bufferScale;
  bA.width = Math.max(2, Math.round(pw * bs)); bA.height = Math.max(2, Math.round(ph * bs));
  bB.width = Math.max(1, bA.width >> 1); bB.height = Math.max(1, bA.height >> 1);
  bC.width = Math.max(1, bB.width >> 1); bC.height = Math.max(1, bB.height >> 1);

  Rdiag = 0.5 * Math.hypot(W, H);
  Rfield = Rdiag * CONFIG.core.fieldCover;
  Rc = 0.5 * Math.min(W, H);
  RcN = Rc / Rfield;
  B = Rfield;
  hashRMax = B * 0.94;
  cxCss = W * 0.5; cyCss = H * 0.5;

  resetCtx(ctx); resetCtx(bActx); resetCtx(bBctx); resetCtx(bCctx);
  buildVisTable();
  gradEpoch = -1;

  // Carry the previous frame across so a rotation or a URL-bar resize never
  // flashes the composition to black.
  if (had) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(carry, 0, 0, pw, ph);
  } else {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, pw, ph);
  }
}

/* ---- gradients (shape + colour only; luminance rides on globalAlpha) --- */
const GMAX = CONFIG.composition.focusGain;
const LAYER_COL = [[0, 1], [1, 2], [2, 3], [3, 1], [1, 4], [0, 0]];
const gradMain = new Array(6).fill(null);
const gradBloom = new Array(6).fill(null);
let bgGrad = null;

function buildGradients() {
  for (let i = 0; i < 6; i++) {
    const a = palette[LAYER_COL[i][0]], b = palette[LAYER_COL[i][1]];
    gradMain[i] = buildLayerGradient(ctx, a, b, 1 / GMAX);
    gradBloom[i] = buildLayerGradient(bActx, a, b, 1 / GMAX);
  }
  const off = Rdiag * 0.10;
  const ox = cxCss + Math.cos(bgDriftAng) * off, oy = cyCss + Math.sin(bgDriftAng) * off;
  const g = ctx.createRadialGradient(ox, oy, 0, cxCss, cyCss, Rdiag * 1.02);
  g.addColorStop(0, rgba(bgIn, 1));
  g.addColorStop(0.30, rgba(mixCol(bgIn, bgOut, 0.55), 1));
  g.addColorStop(0.68, rgba(mixCol(bgIn, bgOut, 0.86), 1));
  g.addColorStop(1, rgba(bgOut, 1));
  bgGrad = g;
}
let bgDriftAng = rr(0, TAU);

/* ---- symmetry stamping ------------------------------------------------- */
function stampPath(c, path, baseScale, ox, oy, n, rot) {
  const seg = TAU / n;
  for (let k = 0; k < n; k++) {
    const a = rot + k * seg;
    const ca = Math.cos(a) * baseScale, sa = Math.sin(a) * baseScale;
    c.setTransform(ca, sa, -sa, ca, ox, oy);
    c.stroke(path);
    c.setTransform(ca, sa, sa, -ca, ox, oy);   // mirrored image -> dihedral group
    c.stroke(path);
  }
}

function drawLayer(c, path, grad, widthCss, alpha, baseScale, ox, oy, n, rot) {
  if (alpha <= 0.002 || widthCss <= 0.01) return;
  c.globalAlpha = Math.min(1, alpha * GMAX);
  c.strokeStyle = grad;
  c.lineWidth = widthCss / SC;
  stampPath(c, path, baseScale, ox, oy, n, rot);
}

/* ---- the stable centre anchor: always there for the eye to rest on ----- */
function drawAnchor(c, baseScale, ox, oy, alpha, stamps) {
  const ra = Rc * CONFIG.trance.anchorRFrac * (1 + 0.05 * Math.sin(breathPhase));
  const w = CONFIG.tiers.boldWidth * widthScale * 0.9;
  c.setTransform(baseScale, 0, 0, baseScale, ox, oy);
  c.lineWidth = w / SC;
  c.globalAlpha = Math.min(1, alpha);
  c.strokeStyle = rgba(palette[0], 1);
  c.beginPath(); c.arc(0, 0, ra, 0, TAU); c.stroke();
  const g = c.createRadialGradient(0, 0, 0, 0, 0, ra * 2.6);
  g.addColorStop(0, rgba(palette[0], 0.55));
  g.addColorStop(0.45, rgba(palette[1], 0.16));
  g.addColorStop(1, rgba(palette[1], 0));
  c.fillStyle = g;
  c.fillRect(-ra * 2.6, -ra * 2.6, ra * 5.2, ra * 5.2);
  if (stamps) addInk(TAU * ra, ra, w, 1, 1);
}

/* ---- bloom: bright pass -> two downsamples -> one full-screen composite - */
function bloomPass() {
  bBctx.setTransform(1, 0, 0, 1, 0, 0);
  bBctx.globalCompositeOperation = 'copy'; bBctx.globalAlpha = 1;
  bBctx.drawImage(bA, 0, 0, bB.width, bB.height);

  bCctx.setTransform(1, 0, 0, 1, 0, 0);
  bCctx.globalCompositeOperation = 'copy'; bCctx.globalAlpha = 1;
  bCctx.drawImage(bB, 0, 0, bC.width, bC.height);

  bBctx.globalCompositeOperation = 'lighter';
  bBctx.globalAlpha = CONFIG.bloom.wideWeight;
  bBctx.drawImage(bC, 0, 0, bB.width, bB.height);

  bActx.setTransform(1, 0, 0, 1, 0, 0);
  bActx.globalCompositeOperation = 'lighter';
  bActx.globalAlpha = CONFIG.bloom.midWeight;
  bActx.drawImage(bB, 0, 0, bA.width, bA.height);

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = bloomAlpha;
  ctx.drawImage(bA, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 1;
}

/* ==========================================================================
   11  TOUCH  -- influence, never control. Nothing pauses, resets, switches
                 mode, or acknowledges a touch as an event. Lifting a finger
                 leaves a wake.
   ========================================================================== */
const WELLS = [];
for (let i = 0; i < CONFIG.touch.maxPointers; i++) {
  WELLS.push({ id: -1, held: false, sx: 0, sy: 0, psx: 0, psy: 0,
               fx: 0, fy: 0, fk: 0, fm: 1, r2: 1, s: 0,
               vx: 0, vy: 0, spin: 1, pull: 1, force: 1, decay: 6 });
}
let wellCount = 0;
let glowGate = 0;
let touchR = 40, touchRF = 40;
let nudgeVel = 0, nudgeBudget = CONFIG.touch.arcNudgeMaxFrac, nudgeLocked = false;

function foldScreen(sx, sy, wl) {
  const n = (sym.x < 1 && sym.x > 0.5) ? sym.nxt : sym.cur;
  const seg = TAU / n, half = seg * 0.5;
  const dx = (sx - cxCss) / SC, dy = (sy - cyCss) / SC;
  const ca = Math.cos(-rotAngle), sa = Math.sin(-rotAngle);
  const qx = ca * dx - sa * dy, qy = sa * dx + ca * dy;
  const r = Math.hypot(qx, qy);
  let th = Math.atan2(qy, qx); if (th < 0) th += TAU;
  let k = Math.floor(th / seg), t = th - k * seg, m = 1;
  if (t > half) { t = seg - t; m = -1; k = k + 1; }
  wl.fx = r * Math.cos(t); wl.fy = r * Math.sin(t);
  wl.fk = k % n; wl.fm = m;
}

function findWell(id) {
  for (let i = 0; i < WELLS.length; i++) if (WELLS[i].id === id) return WELLS[i];
  return null;
}

function onDown(e) {
  e.preventDefault();
  if (findWell(e.pointerId)) return;
  let wl = null;
  for (let i = 0; i < WELLS.length; i++) if (WELLS[i].id < 0 && WELLS[i].s <= 0.02) { wl = WELLS[i]; break; }
  if (!wl) for (let i = 0; i < WELLS.length; i++) if (WELLS[i].id < 0) { wl = WELLS[i]; break; }
  if (!wl) return;
  wl.id = e.pointerId; wl.held = true;
  wl.sx = wl.psx = e.clientX; wl.sy = wl.psy = e.clientY;
  wl.vx = wl.vy = 0;
  wl.spin = rnd() < 0.5 ? 1 : -1;
  wl.pull = rnd() < 0.68 ? -1 : 1;              // mostly a gentle repulsor
  wl.decay = rr(CONFIG.touch.decayMinSec, CONFIG.touch.decayMaxSec);
  foldScreen(wl.sx, wl.sy, wl);
}

function onMove(e) {
  const wl = findWell(e.pointerId);
  if (!wl) return;
  e.preventDefault();
  wl.sx = e.clientX; wl.sy = e.clientY;
}

function onUp(e) {
  const wl = findWell(e.pointerId);
  if (!wl) return;
  wl.id = -1; wl.held = false;   // strength keeps decaying: a wake, not a stop
}

function updateWells(dt) {
  const T = CONFIG.touch;
  touchR = T.radiusFrac * Math.min(W, H);
  touchRF = touchR / SC;
  const rise = dt / (T.riseMs / 1000);
  const dragTC = 1 - Math.exp(-dt / 0.22);
  const relaxTC = Math.exp(-dt / 1.15);
  let active = 0, sum = 0;

  for (let i = 0; i < WELLS.length; i++) {
    const wl = WELLS[i];
    if (wl.held) {
      wl.s = Math.min(1, wl.s + rise);
      const ddx = wl.sx - wl.psx, ddy = wl.sy - wl.psy;
      wl.psx = wl.sx; wl.psy = wl.sy;
      foldScreen(wl.sx, wl.sy, wl);
      if (dt > 0 && (ddx !== 0 || ddy !== 0)) {
        // Directional velocity painted along the stroke, weighted by speed:
        // fast drags stir, slow drags bend.
        let px = ddx / dt, py = ddy / dt;
        const sp = Math.hypot(px, py);
        if (sp > T.dragMaxPxPerSec) { px *= T.dragMaxPxPerSec / sp; py *= T.dragMaxPxPerSec / sp; }
        const n = (sym.x < 1 && sym.x > 0.5) ? sym.nxt : sym.cur;
        const ang = -(rotAngle + wl.fk * (TAU / n));
        const c2 = Math.cos(ang), s2 = Math.sin(ang);
        const tx = (c2 * px - s2 * py) / SC;
        const ty = (s2 * px + c2 * py) / SC * wl.fm;
        wl.vx += (tx - wl.vx) * dragTC;
        wl.vy += (ty - wl.vy) * dragTC;
      } else {
        wl.vx *= relaxTC; wl.vy *= relaxTC;
      }
    } else if (wl.s > 0) {
      wl.s *= Math.exp(-dt * 3 / wl.decay);
      if (wl.s < 0.002) wl.s = 0;
      wl.vx *= relaxTC; wl.vy *= relaxTC;
    }
    wl.r2 = touchRF * touchRF;
    wl.force = CONFIG.flow.speedPx * Rfield * 2.1 * rmTouch;
    if (wl.s > 0.001) { active++; sum += wl.s; }
  }
  wellCount = active;
  glowGate = slew(glowGate, active > 0 ? 1 : 0, 2.5, dt);

  // ---- arc clock nudge: bounded, smoothed, and locked out at BLOOM so no
  //      amount of tapping can chain one bloom into another.
  let target = 0;
  if (active > 0 && !nudgeLocked && nudgeBudget > 0) target = T.arcNudgeRate * rmTouch;
  nudgeVel += (target - nudgeVel) * (1 - Math.exp(-dt / T.arcNudgeSmoothSec));
  if (nudgeVel > 0) {
    nudgeBudget -= nudgeVel * dt / Math.max(1, arc.len);
    if (nudgeBudget <= 0) { nudgeBudget = 0; nudgeVel *= Math.exp(-dt * 2); }
  }
  if (arc.p >= PH_START[2] - 0.015) nudgeLocked = true;
}

/* Local luminance only. The total is normalised across pointers and gated,
   so no amount of tapping can move global brightness. */
function drawWells(baseScale, n, rot) {
  if (wellCount === 0 || glowGate <= 0.002) return;
  let sum = 0;
  for (let i = 0; i < WELLS.length; i++) sum += WELLS[i].s;
  if (sum <= 0.001) return;
  const per = Math.min(CONFIG.touch.glowAlpha, CONFIG.safety.touchLumCap) * expo / Math.max(1, sum);
  const seg = TAU / n, R = touchR;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < WELLS.length; i++) {
    const wl = WELLS[i];
    if (wl.s <= 0.001) continue;
    const a = per * wl.s * glowGate;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R);
    g.addColorStop(0, rgba(palette[0], a));
    g.addColorStop(0.35, rgba(palette[1], a * 0.42));
    g.addColorStop(1, rgba(palette[1], 0));
    ctx.globalAlpha = 1;
    ctx.fillStyle = g;
    for (let k = 0; k < n; k++) {
      const ang = rot + k * seg, ca = Math.cos(ang), sa = Math.sin(ang);
      for (let m = 1; m >= -1; m -= 2) {
        const fy = wl.fy * m;
        const px = cxCss + SC * (ca * wl.fx - sa * fy);
        const py = cyCss + SC * (sa * wl.fx + ca * fy);
        if (px < -R || py < -R || px > W + R || py > H + R) continue;
        ctx.setTransform(DPR, 0, 0, DPR, DPR * px, DPR * py);
        ctx.fillRect(-R, -R, R * 2, R * 2);
      }
    }
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

addEventListener('pointerdown', onDown, { passive: false });
addEventListener('pointermove', onMove, { passive: false });
addEventListener('pointerup', onUp, { passive: false });
addEventListener('pointercancel', onUp, { passive: false });
addEventListener('pointerout', function (e) { if (e.pointerType !== 'mouse') onUp(e); }, { passive: false });
addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
addEventListener('contextmenu', function (e) { e.preventDefault(); }, { passive: false });

/* ==========================================================================
   12  DEBUG  -- hidden unless ?debug=1, and zero cost when it is
   ========================================================================== */
const dbgEl = document.getElementById('dbg');
let dbgAcc = 0;
if (DEBUG) dbgEl.style.display = 'block';

function updateDebug(dt) {
  dbgAcc += dt * 1000;
  if (dbgAcc < CONFIG.debug.updateMs) return;
  dbgAcc = 0;
  const fold = (sym.x < 1 && sym.cur !== sym.nxt)
    ? sym.cur + '→' + sym.nxt + ' ' + (sym.x * 100 | 0) + '%'
    : String(sym.nxt);
  dbgEl.textContent =
    'fps    ' + (1000 / Math.max(0.001, frameAvgMs)).toFixed(1) +
    '\nframe  ' + frameAvgMs.toFixed(2) + ' ms' +
    '\nnodes  ' + nActive + ' / ' + MAXN +
    '\nlinks  ' + linkCount +
    '\nink    ' + inkNow.toFixed(4) + '  budget ' + arc.v.inkBudget.toFixed(3) +
    '\nphase  ' + CONFIG.arc.names[arc.phase] + '  ' + (arc.phaseProg * 100).toFixed(0) + '%' +
    '\ncycle  ' + (arc.p * 100).toFixed(1) + '%  of ' + arc.len.toFixed(0) + 's  #' + arc.cycle +
    '\nfold   ' + fold +
    '\nqual   ' + quality.toFixed(2) + '  ink× ' + inkScale.toFixed(2) +
    '  fine ' + fineScale.toFixed(2) +
    '\nseed   ' + SEED;
}

/* ==========================================================================
   13  LOOP  -- lifecycle, adaptive quality, ink governor, main frame
   ========================================================================== */
let clock = 0, lastT = 0, rafId = 0, breathPhase = rr(0, TAU), rotPhase = rr(0, TAU);
const pMid = [null, null, null], pFine = [null, null, null];
let pDot = null;

/* Mean degree for this fold count. foldComp keeps ink roughly fold-independent:
   ink goes as degree^1.5 * sqrt(2n), so degree gets (10/2n)^(1/3). */
function degreeFor(n) {
  const L = CONFIG.links;
  const foldComp = Math.pow(10 / (2 * n), 1 / 3);
  return clamp((L.degreeAt0 + L.degreeAt1 * arc.v.cohesion) * densityTotal * foldComp,
               0.18, L.maxDegree);
}

/* Link radius follows the lattice's SPATIAL scale (cohesion), independent of
   how many links survive the degree cap -- so BLOOM gets fewer, longer, cleaner
   spans rather than a denser scatter. */
function computeLinkR(n) {
  const L = CONFIG.links;
  // Mean spacing of the FOLDED, linkable population -- the density the lattice
  // actually sees, not the population of the whole field box.
  const nA = Math.max(24, nLinkable);
  const Rvis = Math.max(1, Rdiag / Math.max(0.2, SC));
  const spacing = Rvis * Math.sqrt(Math.PI / (2 * n * nA));
  const R = spacing * (L.spanAt0 + L.spanAt1 * arc.v.cohesion);
  return clamp(R, Rfield * L.radiusMinFrac, Rfield * L.radiusMaxFrac);
}

function buildLattice(n, w) {
  const stamps = 2 * n;
  const T = CONFIG.tiers;
  const wMid = T.midWidth * widthScale, wFine = T.fineWidth * widthScale;
  const useFine = fineScale > 0.02;
  foldNodes(n);
  const linkR = computeLinkR(n);
  buildHash(linkR, n);
  buildLinks(linkR, stamps, degreeFor(n));

  for (let k = 0; k < 3; k++) { pMid[k] = new Path2D(); pFine[k] = new Path2D(); }
  pDot = new Path2D();

  for (let l = 0; l < linkCount; l++) {
    const a = lkA[l], b = lkB[l];
    const ax = fxA[a], ay = fyA[a], bx = fxA[b], by = fyA[b];
    const fine = lkT[l] === 1;
    if (fine && !useFine) continue;
    const p = (fine ? pFine : pMid)[lkK[l]];
    p.moveTo(ax, ay); p.lineTo(bx, by);
    const mx = (ax + bx) * 0.5, my = (ay + by) * 0.5;
    addInk(Math.hypot(bx - ax, by - ay), Math.hypot(mx, my), fine ? wFine : wMid, stamps, w);
  }

  const rd0 = CONFIG.tiers.dotRadius * widthScale / SC;
  const fadeIn = CONFIG.nodes.fadeInSec;
  for (let i = ROLE_START[0]; i < ROLE_END[0]; i++) {
    if (!nIn[i]) continue;
    // a new bold point grows in rather than appearing
    const rd = rd0 * (nAge[i] < fadeIn ? smoothstep(nAge[i] / fadeIn) : 1);
    if (rd < 0.2) continue;
    pDot.moveTo(fxA[i] + rd, fyA[i]);
    pDot.arc(fxA[i], fyA[i], rd, 0, TAU);
    addInk(TAU * rd, nrad[i], CONFIG.tiers.dotWidth * widthScale, stamps, w);
  }
}

function renderFold(fs, gwA, gwB) {
  const n = fs.n, w = fs.w;
  if (w <= 0.002) return;
  const stamps = 2 * n;
  const T = CONFIG.tiers, L = lumGlobal * expo, BK = CONFIG.links.bucketAlpha;
  const bs = CONFIG.bloom.bufferScale, bb = CONFIG.bloom.brightBoost;
  const baseM = DPR * SC, baseB = DPR * bs * SC;
  const oxM = DPR * cxCss, oyM = DPR * cyCss;
  const oxB = DPR * bs * cxCss, oyB = DPR * bs * cyCss;
  const rot = rotAngle, grot = rotAngle + geoPhase;

  buildLattice(n, w);

  geoA.bold = new Path2D(); geoA.mid = new Path2D(); geoA.fine = new Path2D();
  buildGeometry(motifA, geoA, n, stamps, clock, w * gwA);
  if (gwB > 0.002) {
    geoB.bold = new Path2D(); geoB.mid = new Path2D(); geoB.fine = new Path2D();
    buildGeometry(motifB, geoB, n, stamps, clock, w * gwB);
  }

  ctx.globalCompositeOperation = 'lighter';

  // tertiary: the fine dusting
  for (let k = 2; k >= 0; k--) if (lkBins[3 + k])
    drawLayer(ctx, pFine[k], gradMain[2], T.fineWidth * widthScale, T.fineAlpha * L * fineScale * BK[k] * w, baseM, oxM, oyM, n, rot);
  if (geoA.hasFine) drawLayer(ctx, geoA.fine, gradMain[4], T.geoFineWidth * widthScale, T.geoFineAlpha * L * fineScale * w * gwA, baseM, oxM, oyM, n, grot);
  if (gwB > 0.002 && geoB.hasFine) drawLayer(ctx, geoB.fine, gradMain[4], T.geoFineWidth * widthScale, T.geoFineAlpha * L * fineScale * w * gwB, baseM, oxM, oyM, n, grot);

  // secondary: the lattice and the subdivided geometry
  for (let k = 2; k >= 0; k--) if (lkBins[k])
    drawLayer(ctx, pMid[k], gradMain[1], T.midWidth * widthScale, T.midAlpha * L * midScale * BK[k] * w, baseM, oxM, oyM, n, rot);
  drawLayer(ctx, geoA.mid, gradMain[3], T.geoMidWidth * widthScale, T.geoMidAlpha * L * w * gwA, baseM, oxM, oyM, n, grot);
  if (gwB > 0.002) drawLayer(ctx, geoB.mid, gradMain[3], T.geoMidWidth * widthScale, T.geoMidAlpha * L * w * gwB, baseM, oxM, oyM, n, grot);

  // primary: a few bold strokes, never shed
  drawLayer(ctx, geoA.bold, gradMain[0], T.boldWidth * widthScale, T.boldAlpha * L * w * gwA, baseM, oxM, oyM, n, grot);
  if (gwB > 0.002) drawLayer(ctx, geoB.bold, gradMain[0], T.boldWidth * widthScale, T.boldAlpha * L * w * gwB, baseM, oxM, oyM, n, grot);
  drawLayer(ctx, pDot, gradMain[5], T.dotWidth * widthScale, T.dotAlpha * L * w, baseM, oxM, oyM, n, rot);

  // bright pass -> bloom buffer
  bActx.globalCompositeOperation = 'lighter';
  if (lkBins[0]) drawLayer(bActx, pMid[0], gradBloom[1], T.midWidth * widthScale, T.midAlpha * L * midScale * w * bb * 0.7, baseB, oxB, oyB, n, rot);
  if (lkBins[1]) drawLayer(bActx, pMid[1], gradBloom[1], T.midWidth * widthScale, T.midAlpha * L * midScale * w * bb * 0.7 * BK[1], baseB, oxB, oyB, n, rot);
  drawLayer(bActx, geoA.mid, gradBloom[3], T.geoMidWidth * widthScale, T.geoMidAlpha * L * w * gwA * bb, baseB, oxB, oyB, n, grot);
  drawLayer(bActx, geoA.bold, gradBloom[0], T.boldWidth * widthScale, T.boldAlpha * L * w * gwA * bb, baseB, oxB, oyB, n, grot);
  if (gwB > 0.002) {
    drawLayer(bActx, geoB.mid, gradBloom[3], T.geoMidWidth * widthScale, T.geoMidAlpha * L * w * gwB * bb, baseB, oxB, oyB, n, grot);
    drawLayer(bActx, geoB.bold, gradBloom[0], T.boldWidth * widthScale, T.boldAlpha * L * w * gwB * bb, baseB, oxB, oyB, n, grot);
  }
  drawLayer(bActx, pDot, gradBloom[5], T.dotWidth * widthScale, T.dotAlpha * L * w * bb, baseB, oxB, oyB, n, rot);
}

function frame(now) {
  rafId = requestAnimationFrame(frame);

  if (lastT === 0) lastT = now;
  let dtMs = now - lastT;
  lastT = now;
  if (!(dtMs >= 0)) dtMs = 0;
  if (dtMs > CONFIG.core.dtClampMs) dtMs = CONFIG.core.dtClampMs;
  const dt = dtMs / 1000;
  clock += dt;
  frameAvgMs += (dtMs - frameAvgMs) * CONFIG.perf.smoothing;

  resize();

  /* ---- adaptive quality: shed density long before shedding bloom ------ */
  const P = CONFIG.perf;
  if (frameAvgMs > P.lowFpsMs) quality -= P.qualityShedPerSec * dt;
  else if (frameAvgMs < P.goodFpsMs) quality += P.qualityRecoverPerSec * dt;
  quality = clamp(quality, P.qualityMin, 1);
  const bloomQ = quality < P.bloomShedBelow ? clamp(0.55 + quality, 0.6, 1) : 1;

  /* ---- state ---------------------------------------------------------- */
  updateWells(dt);
  updateArc(dt, clock);
  updateSym(dt);
  activeFolds();
  updateComposition();
  updatePalette(clock);

  // trance: breathing, rotation, geometry drift
  breathPhase += dt * TAU * CONFIG.trance.breathHz * rmBreath;
  if (breathPhase > TAU) breathPhase -= TAU;
  const breath = Math.sin(breathPhase);
  rotPhase += dt * TAU / (CONFIG.trance.rotPeriodSec / rmRotation);
  if (rotPhase > TAU) rotPhase -= TAU;
  const rs = Math.sin(rotPhase);
  rotSpeed = Math.sign(rs) * Math.pow(Math.abs(rs), CONFIG.trance.rotShape) *
             CONFIG.trance.rotDegPerSecMax * (Math.PI / 180) * rmRotation;
  rotAngle += rotSpeed * dt;
  if (rotAngle > TAU) rotAngle -= TAU; else if (rotAngle < 0) rotAngle += TAU;
  geoPhase += dt * motifA.phaseRate * rmRotation;
  bgDriftAng += dt * 0.006;

  SC = arc.v.expand * (1 + CONFIG.trance.breathScale * breath * rmBreath);
  widthScale = slew(widthScale, arc.v.width, CONFIG.safety.widthRatePerSec, dt);

  // Every path that can move large-area luminance funnels through slew().
  // This is also the cold-start fade: lumGlobal simply begins at 0.
  const lumTarget = arc.v.luminance * (1 + CONFIG.trance.breathLum * breath * rmBreath);
  lumGlobal = slew(lumGlobal, clamp(lumTarget, 0, 1.35), CONFIG.safety.lumRatePerSec, dt);
  bloomAlpha = slew(bloomAlpha, CONFIG.bloom.alphaBase * arc.v.bloom * lumGlobal * bloomQ,
                    CONFIG.safety.bloomRatePerSec, dt);
  bgAlpha = slew(bgAlpha, arc.v.trail, CONFIG.safety.bgRatePerSec, dt);
  expo = bgAlpha / CONFIG.exposure.trailRef;

  densityTotal = clamp(arc.v.density * quality * inkScale, 0.05, 1.15);

  updateFlow(dt, arc.v.tempo);
  churnNodes();
  recycleNodes(dt);
  updateNodes(dt);

  const linkTarget = clamp(Math.round(nActive * degreeFor(FOLDSETS[0].n) * 0.62) + 60, 60, MAXL);
  linkBudget = slew(linkBudget, linkTarget, CONFIG.links.budgetRatePerSec, dt);

  /* ---- draw ----------------------------------------------------------- */
  if (++gradFrame >= 5 || gradEpoch < 0) { gradFrame = 0; gradEpoch = 1; buildGradients(); }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = bgAlpha;
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  bActx.setTransform(1, 0, 0, 1, 0, 0);
  bActx.clearRect(0, 0, bA.width, bA.height);

  let gwA = 1, gwB = 0;
  if (motifBlend < 1) { const s = smootherstep(motifBlend); gwA = 1 - s; gwB = s; }

  inkAccum = 0;
  for (let f = 0; f < foldCount; f++) renderFold(FOLDSETS[f], gwA, gwB);

  const bs = CONFIG.bloom.bufferScale;
  drawAnchor(ctx, DPR * SC, DPR * cxCss, DPR * cyCss,
             CONFIG.tiers.anchorAlpha * Math.max(0.35, lumGlobal) * expo, true);
  drawAnchor(bActx, DPR * bs * SC, DPR * bs * cxCss, DPR * bs * cyCss,
             CONFIG.tiers.anchorAlpha * Math.max(0.35, lumGlobal) * expo * CONFIG.bloom.brightBoost, false);

  drawWells(DPR * SC, FOLDSETS[0].n, rotAngle);

  bloomPass();

  inkNow = inkAccum / Math.max(1, W * H);

  /* ---- ink governor: brightness is protected, density is not ---------- */
  const budget = arc.v.inkBudget;
  if (inkNow > budget) inkScale -= CONFIG.ink.shedRatePerSec * dt * Math.min(2.5, inkNow / budget);
  else inkScale += CONFIG.ink.recoverRatePerSec * dt;
  inkScale = clamp(inkScale, CONFIG.ink.scaleMin, 1);

  // Tier shedding, lowest tier first. This removes elements; it never dims
  // the primaries, the geometry or the bloom.
  let fineT = 1, midT = 1;
  if (inkNow > budget * 1.12) {
    fineT = clamp(1 - (inkNow / budget - 1.12) * 2.4, CONFIG.tiers.minFineScale, 1);
    if (fineT <= 0.03) midT = clamp(1 - (inkNow / budget - 1.6) * 1.3, CONFIG.tiers.minMidScale, 1);
  }
  if (inkNow > CONFIG.ink.hardCap) {
    linkBudget = Math.max(40, linkBudget * Math.max(0.5, CONFIG.ink.hardCap / inkNow) * 0.96);
  }
  fineScale = slew(fineScale, fineT, 0.55, dt);
  midScale = slew(midScale, midT, 0.30, dt);

  if (DEBUG) updateDebug(dt);
}

/* ---- reduced motion: damp it, never disable it ------------------------- */
function applyReducedMotion(on) {
  const R = CONFIG.safety.reduced;
  rmReduced = on;
  rmRotation = on ? R.rotation : 1;
  rmBreath = on ? R.breath : 1;
  rmTransition = on ? R.transition : 1;
  rmTouch = on ? R.touch : 1;
}
(function () {
  try {
    const mq = matchMedia('(prefers-reduced-motion: reduce)');
    applyReducedMotion(mq.matches);
    if (mq.addEventListener) mq.addEventListener('change', function (e) { applyReducedMotion(e.matches); });
    else if (mq.addListener) mq.addListener(function (e) { applyReducedMotion(e.matches); });
  } catch (e) { applyReducedMotion(false); }
})();

/* ---- lifecycle --------------------------------------------------------- */
let wakeLock = null;
function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !document.hidden) {
      navigator.wakeLock.request('screen').then(function (w) {
        wakeLock = w;
        w.addEventListener('release', function () { wakeLock = null; });
      }, function () {});
    }
  } catch (e) { /* fail silently */ }
}

document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  } else {
    lastT = 0;                       // resume without a time jump
    if (!rafId) rafId = requestAnimationFrame(frame);
    requestWakeLock();
  }
});
addEventListener('resize', resize, { passive: true });
addEventListener('orientationchange', function () { setTimeout(resize, 60); }, { passive: true });
if (window.visualViewport) visualViewport.addEventListener('resize', resize, { passive: true });

/* ---- inline manifest + favicon, built from the inline icon ------------- */
(function () {
  try {
    const iconEl = document.querySelector('link[rel="apple-touch-icon"]');
    if (!iconEl) return;
    const icon = iconEl.href;
    const base = location.origin + location.pathname;
    const manifest = {
      name: 'Kaleidra', short_name: 'Kaleidra', id: base,
      start_url: base, scope: base.replace(/[^/]*$/, ''),
      display: 'fullscreen', display_override: ['fullscreen', 'standalone'],
      orientation: 'any', background_color: '#000000', theme_color: '#05060a',
      icons: [{ src: icon, sizes: '180x180', type: 'image/png', purpose: 'any' }]
    };
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'data:application/manifest+json;base64,' + btoa(JSON.stringify(manifest));
    document.head.appendChild(l);
    const f = document.createElement('link');
    f.rel = 'icon'; f.type = 'image/png'; f.sizes = '180x180'; f.href = icon;
    document.head.appendChild(f);
  } catch (e) { /* the piece does not depend on this */ }
})();

/* ---- boot -------------------------------------------------------------- */
(function boot() {
  resize();
  newCycle(true);
  arc.t = rr(0, CONFIG.arc.weights[0]) * arc.len;   // cold start: REST, random offset
  updateArc(0.0001, 0);
  SC = arc.v.expand;
  widthScale = arc.v.width;
  bgAlpha = arc.v.trail;
  expo = bgAlpha / CONFIG.exposure.trailRef;
  densityTotal = clamp(arc.v.density, 0.05, 1.15);
  updatePalette(0);
  updateComposition();
  buildGradients();
  initNodes();
  updateFlow(0.0001, 1);
  linkBudget = MAXL;
  requestWakeLock();
  lastT = 0;
  rafId = requestAnimationFrame(frame);
})();
</script>
</body>
